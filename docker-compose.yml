services:
  capture:
    build: .
    image: capture:latest
    container_name: capture
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - capture-assets:/var/lib/capture/assets
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

volumes:
  capture-assets:
